<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">SeolStudy Backend</title>
  <desc id="desc">A study coaching platform backend banner featuring a planner, feedback cards, chat, and progress indicators.</desc>
  <defs>
