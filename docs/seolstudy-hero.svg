    <text x="0" y="115" fill="#172554" font-family="Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="1">SEOLSTUDY</text>
    <text x="2" y="161" fill="#4f46e5" font-family="Arial, sans-serif" font-size="24" font-weight="700">Learning plans connected with mentoring.</text>
